<!DOCTYPE html>
<html>

<head>
  <title>Jalali Date Convertor</title>
  <meta charset="utf-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <div class="container m-3" style="width: 450px;">
    <h2 class="text-center">Jalali Date Covertor</h2>
    <div class="row">
      <div class="col-5">
        <div class="input-group mb-3">
          <div id="btnGCopy" class="input-group-prepend" role="button">
            <span class="input-group-text px-1 bg-white" id="basic-addon1">
              &shy;	
              <img src="../img/copy.svg" width="14" />
            </span>
          </div>
          <input id="txtGDate" type="text" class="form-control" placeholder="1401/02/02" aria-label="Username"
            aria-describedby="basic-addon1" autocomplete="off" />
          <div id="btnGToJ" class="input-group-prepend" role="button">
            <span class="input-group-text" id="basic-addon1">
              &shy;	
              <img src="../img/right.svg" width="6" />
            </span>
          </div>
        </div>
      </div>
      <div class="col-5">
        <div class="input-group mb-3">
          <div id="btnJToG" class="input-group-prepend" role="button">
            <span class="input-group-text" id="basic-addon1">
              &shy;	
              <img src="../img/right.svg" width="6" style="transform: rotate(180deg);"/>
            </span>
          </div>
          <input id="txtJDate" type="text" class="form-control" placeholder="1401/02/02" aria-label="Username"
            aria-describedby="basic-addon1" autocomplete="off" />            
          <div id="btnJCopy" class="input-group-prepend" role="button">
            <span class="input-group-text px-1 bg-white" id="basic-addon1">
              &shy;	
              <img src="../img/copy.svg" width="14" />
            </span>
          </div>
        </div>
      </div>
      <div class="col-2">
        <button id="btnToday" type="button" class="btn btn-success">Today</button>
      </div>
    </div>
  </div>
</body>
<script src="../js/jquery-3.7.1.min.js"></script>
<script src="../js/jalaali.min.js"></script>
<script src="../js/jalaali-core.js"></script>
<script src="../popup/script.js"></script>

</html>
